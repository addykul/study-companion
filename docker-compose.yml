services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: study-companion-postgres
    environment:
      POSTGRES_DB: study_companion
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
    ports:
      - "5432:5432"
    volumes:
      - study_companion_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study_companion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  study_companion_data:
