server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: study-companion-api
  profiles:
    default: ${AI_PROVIDER_PROFILE:openrouter}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/study_companion}
    username: ${DB_USERNAME:study}
    password: ${DB_PASSWORD:study}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
app:
  upload-dir: ${UPLOAD_DIR:../data/uploads}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  retrieval:
    top-k: 5
    similarity-threshold: 0.25
